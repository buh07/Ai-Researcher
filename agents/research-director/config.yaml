spec_version: 1
name: research-director
description: >-
  Top-level scientific workflow router. It preserves human ownership of the
  objective, delegates overlapping evidence review, hypothesis generation,
  experiment design, independent safety review, and separate result analysis,
  and keeps execution behind exact objective and approval boundaries.

instructions: AGENTS.md

executor:
  type: omnigent
  model: gpt-5.6-sol
  reasoning_effort: high
  config:
    harness: codex

interaction:
  conversational: true
  modalities:
    input: [text]
    output: [text]

async: true
cancellable: true
timers: false

params:
  minimum_experiment_candidates: 2
  maximum_parallel_evidence_tasks: 3
  minimum_overlapping_evidence_tasks: 2
  require_human_objective_confirmation: true
  require_passing_feasibility_gate: true
  require_human_experiment_approval: true
  execution_enabled_by_default: false
  execution_environment_gate: AI_RESEARCHER_ENABLE_EXECUTION

tools:
  agents:
    - evidence-researcher
    - hypothesis-scientist
    - experiment-designer
    - safety-reviewer
    - results-analyst

guardrails:
  ask_timeout: 3600
  policies:
    tool_call_budget:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 80
    session_cost_budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: 8.0
          ask_thresholds_usd: [4.0]
